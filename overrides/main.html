{% extends "base.html" %}

{% block htmltitle %}
  {% if page.is_homepage %}
    <title>a11yst: Your accessibility analyst.</title>
  {% elif page.title %}
    <title>{{ page.title }} | {{ config.site_name }}</title>
  {% else %}
    <title>{{ config.site_name }}</title>
  {% endif %}
{% endblock %}
