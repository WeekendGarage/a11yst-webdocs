site_name: a11yst
site_description: Continuous accessibility testing for modern web applications.
# site_url is intentionally unset until a production domain is provided.
use_directory_urls: true

exclude_docs: |
  assets/landing/report-markdown.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/a11yst-lockup.svg
  favicon: assets/brand/favicon.svg
  font: false
  features:
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/a11y-fixes.js

extra:
  generator: false

nav:
  - Getting Started: getting-started/index.md
  - Core Concepts:
    - Core concepts overview: core-concepts/index.md
    - Route discovery and planning: core-concepts/route-discovery-and-planning.md
  - Regression Testing:
    - Regression testing overview: regression-testing/index.md
    - Baselines: regression-testing/baselines.md
    - Classifications: regression-testing/classifications.md
    - Updating a baseline: regression-testing/updating-baseline.md
    - Policies: regression-testing/policies.md
    - CI workflow: regression-testing/ci-workflow.md
  - Reports: reports/index.md
  - Source Intelligence:
    - Source intelligence overview: source-intelligence/index.md
    - Source mapping: source-intelligence/source-mapping.md
    - Recommendations: source-intelligence/recommendations.md
    - Limitations: source-intelligence/limitations.md
