site_name: a11yst
site_description: Continuous accessibility testing for modern web applications.
# site_url is intentionally unset until a production domain is provided.
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/a11yst-lockup.svg
  favicon: assets/brand/favicon.svg
  font: false
  features:
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/a11y-fixes.js

extra:
  generator: false
